# Render blueprint: New + > Blueprint > pick this repo. Free plan, Singapore (closest region to the
# Indian sites the app reads), built from the Dockerfile.
services:
  - type: web
    name: same-product-finder
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Residential proxy for the requests sites refuse from cloud servers (Myntra, Flipkart product
      # pages), e.g. http://user:pass@host:port. Set in the Render dashboard; never committed.
      - key: PROXY_URL
        sync: false
